<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python IDE Web版 - 2025.10.04</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"  rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs/loader.js"></script> 
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --darker: #0f172a;
            --light: #f8fafc;
            --sidebar-width: 280px;
            --header-height: 60px;
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }
 
        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
 
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }
 
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            transition: var(--transition);
        }
 
        .app-container {
            display: flex;
            height: 100vh;
        }
 
        /* 侧边栏样式 */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: var(--transition);
        }
 
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
 
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
 
        .logo i {
            color: var(--primary);
        }
 
        .sidebar-menu {
            padding: 20px 0;
            flex-grow: 1;
        }
 
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--text-primary);
            text-decoration: none;
            transition: var(--transition);
            gap: 12px;
            cursor: pointer;
        }
 
        .menu-item:hover {
            background-color: var(--bg-tertiary);
        }
 
        .menu-item.active  {
            background-color: rgba(37, 99, 235, 0.1);
            border-left: 3px solid var(--primary);
            color: var(--primary);
        }
 
        .menu-item i {
            width: 20px;
            text-align: center;
        }
 
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
 
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
 
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }
 
        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
        }
 
        .theme-toggle:hover {
            color: var(--primary);
        }
 
        /* 主内容区样式 */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
 
        .header {
            height: var(--header-height);
            background-color: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
 
        .file-tabs {
            display: flex;
            align-items: center;
            gap: 5px;
            overflow-x: auto;
            flex-grow: 1;
        }
 
        .file-tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--bg-tertiary);
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }
 
        .file-tab.active  {
            background-color: var(--primary);
            color: white;
        }
 
        .file-tab .close {
            margin-left: 5px;
            opacity: 0.7;
            transition: var(--transition);
        }
 
        .file-tab .close:hover {
            opacity: 1;
        }
 
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
 
        .btn {
            padding: 8px 16px;
            border-radius: var(--border-radius);
            border: none;
            background-color: var(--primary);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
 
        .btn:hover {
            background-color: var(--primary-dark);
        }
 
        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
 
        .btn-outline:hover {
            background-color: var(--bg-tertiary);
        }
 
        .btn-success {
            background-color: var(--success);
        }
 
        .btn-success:hover {
            background-color: #0da271;
        }
 
        .btn-danger {
            background-color: var(--danger);
        }
 
        .btn-danger:hover {
            background-color: #dc2626;
        }
 
        /* 编辑器区域 */
        .editor-container {
            flex-grow: 1;
            display: flex;
            overflow: hidden;
        }
 
        .editor-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }
 
        .panel-header {
            padding: 10px 20px;
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
 
        .panel-title {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
 
        .panel-actions {
            display: flex;
            gap: 10px;
        }
 
        .editor-wrapper {
            flex-grow: 1;
            position: relative;
        }
 
        #editor {
            width: 100%;
            height: 100%;
        }
 
        /* 终端和AI面板 */
        .output-panel {
            display: flex;
            flex-direction: column;
            height: 40%;
            border-top: 1px solid var(--border-color);
        }
 
        .ai-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
        }
 
        .ai-header {
            padding: 15px 20px;
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
 
        .ai-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
 
        .ai-title i {
            color: var(--primary);
        }
 
        .ai-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
 
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            line-height: 1.5;
        }
 
        .message.user  {
            align-self: flex-end;
            background-color: var(--primary);
            color: white;
        }
 
        .message.ai  {
            align-self: flex-start;
            background-color: var(--bg-tertiary);
        }
 
        .ai-input {
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }
 
        .input-group {
            display: flex;
            gap: 10px;
        }
 
        .input-group input {
            flex-grow: 1;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }
 
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
 
        /* 终端样式 */
        .terminal {
            flex-grow: 1;
            background-color: var(--darker);
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
 
        [data-theme="light"] .terminal {
            background-color: #1a1a1a;
        }
 
        .terminal-line {
            margin-bottom: 5px;
        }
 
        .terminal-prompt {
            color: #00ff00;
        }
 
        .terminal-error {
            color: #ff5555;
        }
 
        /* 状态栏 */
        .status {
            padding: 0 10px;
            font-size: 0.85rem;
            transition: var(--transition);
        }
 
        .status.success  {
            color: var(--success);
        }
 
        .status.error  {
            color: var(--danger);
        }
 
        .status.warning  {
            color: var(--warning);
        }
 
        /* 文件管理器 */
        .file-manager {
            padding: 15px;
        }
 
        .file-manager-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
 
        .file-list-container {
            max-height: 300px;
            overflow-y: auto;
        }
 
        .file-list {
            list-style: none;
        }
 
        .file-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 5px;
        }
 
        .file-item:hover {
            background-color: var(--bg-tertiary);
        }
 
        .file-item i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
 
        .file-actions {
            margin-left: auto;
            opacity: 0;
            transition: var(--transition);
        }
 
        .file-item:hover .file-actions {
            opacity: 1;
        }
 
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .ai-panel {
                width: 350px;
            }
        }
 
        @media (max-width: 992px) {
            .sidebar {
                width: 70px;
            }
            
            .menu-text, .logo-text, .user-name {
                display: none;
            }
            
            .logo {
                justify-content: center;
            }
            
            .menu-item {
                justify-content: center;
                padding: 15px;
            }
            
            .sidebar-footer {
                justify-content: center;
            }
        }
 
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
 
        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }
 
        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 3px;
        }
 
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
    </style>
</head>

    <script>
        // 全局变量 
        let editor;
        let currentFile = 'main.py'; 
        let openFiles = [currentFile];
        let fileContents = {
            'main.py':  `# Python代码示例 - 2025.10.04 
def fibonacci(n):
    """计算斐波那契数列的前n项"""
    if n <= 0:
        return []
    elif n == 1:
        return [0]
    elif n == 2:
        return [0, 1]
    else:
        fib_sequence = [0, 1]
        for i in range(2, n):
            fib_sequence.append(fib_sequence[i-1]  + fib_sequence[i-2])
        return fib_sequence 
 
# 测试函数 
if __name__ == "__main__":
    n = 10 
    result = fibonacci(n)
    print(f"斐波那契数列前{n}项: {result}")`
        };
 
        // 初始化Monaco编辑器 
        function initEditor() {
            require.config({  paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs'  }});
            
            require(['vs/editor/editor.main'],  function() {
                editor = monaco.editor.create(document.getElementById('editor'),  {
                    value: fileContents[currentFile],
                    language: 'python',
                    theme: document.body.getAttribute('data-theme')  === 'dark' ? 'vs-dark' : 'vs',
                    fontSize: 14,
                    minimap: { enabled: true },
                    automaticLayout: true,
                    scrollBeyondLastLine: false,
                    lineNumbers: 'on',
                    renderLineHighlight: 'all',
                    scrollbar: {
                        vertical: 'visible',
                        horizontal: 'visible',
                        useShadows: false 
                    },
                    quickSuggestions: true,
                    suggestOnTriggerCharacters: true,
                    tabCompletion: 'on'
                });
 
                // 添加快捷键 
                editor.addCommand(monaco.KeyMod.CtrlCmd  | monaco.KeyCode.KeyS, function() {
                    saveFile();
                });
 
                editor.addCommand(monaco.KeyCode.F5,  function() {
                    runCode();
                });
 
                // 窗口大小变化时调整编辑器 
                window.addEventListener('resize',  function() {
                    editor.layout(); 
                });
            });
        }
 
        // 主题切换功能 
        function setupThemeToggle() {
            const themeToggle = document.getElementById('themeToggle'); 
            const body = document.body; 
            
            themeToggle.addEventListener('click',  () => {
                const currentTheme = body.getAttribute('data-theme'); 
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                body.setAttribute('data-theme',  newTheme);
                
                // 更新图标 
                const icon = themeToggle.querySelector('i'); 
                icon.className  = newTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
                
                // 更新编辑器主题 
                if (editor) {
                    monaco.editor.setTheme(newTheme  === 'dark' ? 'vs-dark' : 'vs');
                }
                
                // 保存主题偏好 
                localStorage.setItem('theme',  newTheme);
            });
            
            // 加载保存的主题 
            const savedTheme = localStorage.getItem('theme')  || 'dark';
            body.setAttribute('data-theme',  savedTheme);
            const icon = themeToggle.querySelector('i'); 
            icon.className  = savedTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }
 
        // 文件管理功能 
        function setupFileManagement() {
            // 新建文件 
            document.getElementById('newFileBtn').addEventListener('click',  function() {
                const filename = prompt('请输入文件名:', `script_${new Date().getTime()}.py`);
                if (filename) {
                    if (!filename.endsWith('.py'))  {
                        filename += '.py';
                    }
                    
                    fileContents[filename] = `# ${filename}\n# 创建于2025年10月4日\n\nprint("Hello, World!")`;
                    openFile(filename);
                }
            });
 
            // 保存文件 
            document.getElementById('saveFileBtn').addEventListener('click',  function() {
                saveFile();
            });
        }
 
        // 打开文件 
        function openFile(filename) {
            if (!openFiles.includes(filename))  {
                openFiles.push(filename); 
                addFileTab(filename);
            }
            
            // 设置当前文件 
            currentFile = filename;
            document.querySelectorAll('.file-tab').forEach(tab  => {
                tab.classList.toggle('active',  tab.getAttribute('data-file')  === filename);
            });
            
            // 更新面板标题 
            document.querySelector('.panel-title').textContent  = `代码编辑器 - ${filename}`;
            
            // 加载文件内容到编辑器 
            if (fileContents[filename]) {
                editor.setValue(fileContents[filename]); 
            } else {
                fetch(`/files/${filename}`)
                    .then(response => response.text()) 
                    .then(content => {
                        editor.setValue(content); 
                        fileContents[filename] = content;
                    })
                    .catch(error => {
                        showStatusMessage(`加载文件失败: ${error}`, 'error');
                    });
            }
        }
 
        // 添加文件标签页 
        function addFileTab(filename) {
            const tabsContainer = document.querySelector('.file-tabs'); 
            const tab = document.createElement('div'); 
            tab.className  = 'file-tab';
            tab.setAttribute('data-file',  filename);
            tab.innerHTML  = `
                <i class="fas fa-file-code"></i>
                <span>${filename}</span>
                <i class="fas fa-times close"></i>
            `;
            tabsContainer.appendChild(tab); 
            
            // 绑定标签页事件 
            tab.addEventListener('click',  function() {
                document.querySelectorAll('.file-tab').forEach(t  => t.classList.remove('active')); 
                this.classList.add('active'); 
                openFile(this.getAttribute('data-file')); 
            });
            
            // 关闭标签页 
            const closeBtn = tab.querySelector('.close'); 
            closeBtn.addEventListener('click',  function(e) {
                e.stopPropagation(); 
                closeFileTab(filename);
            });
        }
 
        // 关闭文件标签页 
        function closeFileTab(filename) {
            const tab = document.querySelector(`.file-tab[data-file="${filename}"]`); 
            if (tab) {
                tab.remove(); 
                const index = openFiles.indexOf(filename); 
                if (index > -1) {
                    openFiles.splice(index,  1);
                }
                
                // 如果关闭的是当前文件，激活下一个标签 
                if (currentFile === filename) {
                    if (openFiles.length  > 0) {
                        const nextFile = openFiles[Math.max(0, index - 1)];
                        openFile(nextFile);
                    } else {
                        createNewFile();
                    }
                }
            }
        }
 
        // 保存文件 
        function saveFile(filename = currentFile) {
            const content = editor.getValue(); 
            
            fetch('/files', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    filename: filename,
                    content: content 
                })
            })
            .then(response => response.json()) 
            .then(data => {
                if (data.status  === 'success') {
                    fileContents[filename] = content;
                    showStatusMessage(`文件保存成功: ${filename}`, 'success');
                } else {
                    showStatusMessage(`保存失败: ${data.message}`,  'error');
                }
            })
            .catch(error => {
                showStatusMessage(`保存错误: ${error}`, 'error');
            });
        }
 
        // 运行代码 
        function runCode() {
            const terminal = document.getElementById('terminal'); 
            const code = editor.getValue(); 
            
            // 添加执行命令 
            addTerminalLine(`$ python ${currentFile}`);
            
            // 显示执行中状态 
            const loadingId = `loading-${Date.now()}`; 
            addTerminalLine('执行中...', loadingId);
            
            // 发送到后端执行 
            fetch('/execute', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({  code: code })
            })
            .then(response => response.json()) 
            .then(data => {
                // 移除加载状态 
                const loadingElement = document.getElementById(loadingId); 
                if (loadingElement) loadingElement.remove(); 
                
                // 显示执行结果 
                if (data.stdout)  {
                    addTerminalLine(data.stdout); 
                }
                if (data.stderr)  {
                    addTerminalLine(data.stderr,  null, 'error');
                }
                
                // 添加新提示符 
                addTerminalPrompt();
                
                // 更新状态 
                if (data.returncode  === 0) {
                    showStatusMessage('代码执行成功', 'success');
                } else {
                    showStatusMessage(`代码执行失败 (返回码: ${data.returncode})`,  'error');
                }
            })
            .catch(error => {
                addTerminalLine(`执行错误: ${error.message}`,  null, 'error');
                addTerminalPrompt();
                showStatusMessage('执行过程中发生错误', 'error');
            });
        }
 
        // 终端功能 
        function setupTerminal() {
            // 清除终端 
            document.getElementById('clearOutput').addEventListener('click',  function() {
                document.getElementById('terminal').innerHTML  = '';
                addTerminalPrompt();
            });
 
            // 最大化终端 
            document.getElementById('toggleTerminal').addEventListener('click',  function() {
                const outputPanel = document.querySelector('.output-panel'); 
                outputPanel.classList.toggle('expanded'); 
                editor.layout(); 
            });
        }
 
        // 添加终端行 
        function addTerminalLine(text, id = null, className = null) {
            const terminal = document.getElementById('terminal'); 
            const line = document.createElement('div'); 
            line.className  = 'terminal-line' + (className ? ` ${className}` : '');
            if (id) line.id  = id;
            line.textContent  = text;
            terminal.appendChild(line); 
            terminal.scrollTop  = terminal.scrollHeight; 
        }
 
        // 添加终端提示符 
        function addTerminalPrompt() {
            const terminal = document.getElementById('terminal'); 
            const promptLine = document.createElement('div'); 
            promptLine.className  = 'terminal-line';
            promptLine.innerHTML  = '<span class="terminal-prompt">$</span> <span class="cursor">█</span>';
            terminal.appendChild(promptLine); 
            terminal.scrollTop  = terminal.scrollHeight; 
        }
 
        // AI助手功能 
        function setupAIAssistant() {
            // 发送消息 
            document.getElementById('sendAiMessage').addEventListener('click',  sendAiMessage);
            document.getElementById('aiInput').addEventListener('keypress',  function(e) {
                if (e.key  === 'Enter') {
                    sendAiMessage();
                }
            });
 
            // 清空对话 
            document.getElementById('clearChat').addEventListener('click',  function() {
                document.getElementById('aiContent').innerHTML  = '';
                
                const welcomeMessage = document.createElement('div'); 
                welcomeMessage.className  = 'message ai';
                welcomeMessage.textContent  = '你好！我是你的Python编程助手。今天是2025年10月4日，农历八月十三，有什么我可以帮助你的吗？';
                document.getElementById('aiContent').appendChild(welcomeMessage); 
            });
        }
 
        // 发送AI消息 
        function sendAiMessage() {
            const input = document.getElementById('aiInput'); 
            const message = input.value.trim(); 
            
            if (message) {
                // 添加用户消息 
                const userMessage = document.createElement('div'); 
                userMessage.className  = 'message user';
                userMessage.textContent  = message;
                document.getElementById('aiContent').appendChild(userMessage); 
                
                // 清空输入框 
                input.value  = '';
                
                // 滚动到底部 
                document.getElementById('aiContent').scrollTop  = document.getElementById('aiContent').scrollHeight; 
                
                // 显示思考中 
                const thinkingMessage = document.createElement('div'); 
                thinkingMessage.className  = 'message ai';
                thinkingMessage.textContent  = '思考中...';
                thinkingMessage.id  = 'thinkingMessage';
                document.getElementById('aiContent').appendChild(thinkingMessage); 
                
                document.getElementById('aiContent').scrollTop  = document.getElementById('aiContent').scrollHeight; 
                
                // 发送到后端AI服务 
                fetch('/ai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({  question: message })
                })
                .then(response => response.json()) 
                .then(data => {
                    document.getElementById('aiContent').removeChild(thinkingMessage); 
                    
                    const aiMessage = document.createElement('div'); 
                    aiMessage.className  = 'message ai';
                    
                    if (data.type  === 'code') {
                        aiMessage.innerHTML  = data.answer.replace(/```python([\s\S]*?)```/g,  
                            '<pre style="margin-top: 10px; background: var(--bg-tertiary); padding: 10px; border-radius: 4px; overflow-x: auto; color: var(--text-primary);">$1</pre>');
                    } else {
                        aiMessage.textContent  = data.answer; 
                    }
                    
                    document.getElementById('aiContent').appendChild(aiMessage); 
                    document.getElementById('aiContent').scrollTop  = document.getElementById('aiContent').scrollHeight; 
                });
            }
        }
 
        // 状态消息显示 
        function showStatusMessage(message, type = 'info') {
            const statusElement = document.querySelector('.status'); 
            statusElement.textContent  = message;
            statusElement.className  = 'status ' + type;
            
            // 3秒后恢复默认状态 
            setTimeout(() => {
                statusElement.textContent  = 'Ready';
                statusElement.className  = 'status';
            }, 3000);
        }
 
        // 初始化应用 
        document.addEventListener('DOMContentLoaded',  function() {
            // 设置主题切换 
            setupThemeToggle();
            
            // 初始化编辑器 
            initEditor();
            
            // 设置文件管理 
            setupFileManagement();
            
            // 设置终端功能 
            setupTerminal();
            
            // 设置AI助手 
            setupAIAssistant();
            
            // 设置快捷键 
            document.addEventListener('keydown',  function(e) {
                if (e.ctrlKey  && e.key  === 's') {
                    e.preventDefault(); 
                    saveFile();
                }
            });
            
            // 每分钟自动保存 
            setInterval(() => {
                if (currentFile && editor) {
                    saveFile(currentFile);
                }
            }, 60000);
        });
    </script>
</body>
</html>
